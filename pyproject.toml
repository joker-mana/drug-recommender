[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-rec"
version = "0.1.0"
description = "Public-data drug candidate ranking and safety constraint assessment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "networkx",
  "pyarrow",
  "joblib",
  "matplotlib",
  "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

